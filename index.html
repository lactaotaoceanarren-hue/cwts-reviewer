      const quizContainer = document.getElementById("quizContainer");
      const quizForm = document.getElementById("quizForm");
      const scoreBanner = document.getElementById("scoreBanner");
      const scoreText = document.getElementById("scoreText");
      const scoreSubtext = document.getElementById("scoreSubtext");
      const resetBtn = document.getElementById("resetBtn");
      const topicFilter = document.getElementById("topicFilter");

      function renderQuiz() {
        let lastTopic = "";
        quizContainer.innerHTML = "";

        quizData.forEach(function (item, idx) {
          if (item.topic !== lastTopic) {
            const h2 = document.createElement("h2");
            h2.className = "topic-heading";
            h2.setAttribute("data-topic", item.topic);
            h2.textContent = item.topic;
            quizContainer.appendChild(h2);
            lastTopic = item.topic;
          }

          const card = document.createElement("div");
          card.className = "question-card";
          card.setAttribute("data-index", String(idx));
          card.setAttribute("data-topic", item.topic);

          const qText = document.createElement("div");
          qText.className = "question-text";
          qText.textContent = item.q;
          card.appendChild(qText);

          const optionsDiv = document.createElement("div");
          optionsDiv.className = "options";

          item.options.forEach(function (opt, optIdx) {
            const label = document.createElement("label");
            label.className = "option-label";
            label.setAttribute("data-opt-index", String(optIdx));

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "q" + idx;
            radio.value = String(optIdx);

            const span = document.createElement("span");
            span.textContent = opt;

            label.appendChild(radio);
            label.appendChild(span);
            optionsDiv.appendChild(label);
          });

          const explainDiv = document.createElement("div");
          explainDiv.className = "explanation";
          explainDiv.textContent = item.explain;

          card.appendChild(optionsDiv);
          card.appendChild(explainDiv);
          quizContainer.appendChild(card);
        });
      }

      function applyFilter() {
        const chosen = topicFilter.value;
        document.querySelectorAll(".topic-heading, .question-card").forEach(function (el) {
          if (chosen === "ALL" || el.getAttribute("data-topic") === chosen) {
            el.classList.remove("hidden");
          } else {
            el.classList.add("hidden");
          }
        });
      }

      function gradeQuiz(event) {
        if (event) {
          event.preventDefault();
        }
        let score = 0;
        let total = 0;
        const chosen = topicFilter.value;
        const cards = document.querySelectorAll(".question-card");

        cards.forEach(function (card) {
          const idx = Number(card.getAttribute("data-index"));
          const itemTopic = quizData[idx].topic;
          const isVisible = chosen === "ALL" || itemTopic === chosen;
          const correctIdx = quizData[idx].answer;
          const selected = card.querySelector('input[name="q' + idx + '"]:checked');
          const labels = card.querySelectorAll(".option-label");
          const explain = card.querySelector(".explanation");

          labels.forEach(function (lbl) {
            lbl.classList.remove("correct", "incorrect");
            if (Number(lbl.getAttribute("data-opt-index")) === correctIdx) {
              lbl.classList.add("correct");
            }
          });

          if (isVisible) {
            total += 1;
          }

          if (selected) {
            const chosenIdx = Number(selected.value);
            if (chosenIdx === correctIdx) {
              if (isVisible) score += 1;
            } else if (labels[chosenIdx]) {
              labels[chosenIdx].classList.add("incorrect");
            }
          }

          if (explain) {
            explain.classList.add("visible");
          }
        });

        const pct = total > 0 ? Math.round((score / total) * 100) : 0;
        scoreText.textContent = "Score: " + score + " / " + total + " (" + pct + "%)";
        scoreSubtext.textContent =
          pct >= 80
            ? "Great job! You have a strong grasp of these topics."
            : "Good review session—check the explanations below for any missed items.";
        scoreBanner.classList.add("visible");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      topicFilter.addEventListener("change", applyFilter);
      quizForm.addEventListener("submit", gradeQuiz);

      resetBtn.addEventListener("click", function () {
        quizForm.reset();
        scoreBanner.classList.remove("visible");
        document.querySelectorAll(".option-label").forEach(function (lbl) {
          lbl.classList.remove("correct", "incorrect");
        });
        document.querySelectorAll(".explanation").forEach(function (exp) {
          exp.classList.remove("visible");
        });
      });

      renderQuiz();
    })();
  </script>
